<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css"> 
     
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Form Practice</title>
</head>
<body>
<div class="header-div">
    <h1>This is a cool form</h1>
</div>
<div class="form-div">
<h3>All fields are required - please complete all fields appropriately</h3>
<form action="/handle-form-page" method="post">
    <p>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="first_name" required />
    </p>
    <p>
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="last_name" required />
    </p>
    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
    </p>
    <p>
        <label for="phonenumber">Phone Number:</label>
       <input type="tel" id="phonenumber" name="phonenumber" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required />
       <br><small>please use the phone number format 000-000-0000</small>
    </p>
    <p class="button">
        <button type="submit">Send it in!</button>
    </p>
</form>
<h5>posting to an API endpoint!</h5>
</div>
</body>
</html>
